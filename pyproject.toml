[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dengue-alerta"
version = "0.1.0"
description = "Modelo de machine learning explicable para la predicción temprana de brotes de dengue a nivel distrital en el Perú"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nombre Apellido" }]  # <- reemplazar por tu nombre
keywords = ["dengue", "alerta temprana", "machine learning", "SHAP", "salud pública", "Perú"]

# Dependencias mínimas: lo necesario para construir el panel y entrenar modelos clásicos.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "epiweeks>=2.3",
    "pyyaml>=6.0",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# Modelos de gradient boosting, explicabilidad y seguimiento de experimentos
ml = ["lightgbm>=4.3", "xgboost>=2.0", "shap>=0.45", "optuna>=3.6", "mlflow>=2.12"]
# Cartografía: adyacencia entre distritos a partir del shapefile del INEI
geo = ["geopandas>=0.14", "shapely>=2.0"]
# Tablero de alerta temprana
app = ["streamlit>=1.50", "plotly>=5.20"]
# Modelo recurrente (LSTM) - etapa posterior
dl = ["torch>=2.2"]
# Herramientas de desarrollo
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "pre-commit>=3.7", "nbstripout>=0.7"]

[project.scripts]
dengue-alerta = "dengue_alerta.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# ------------------------------------------------------------------
# Ruff: linter + formateador (reemplaza a flake8, isort y black)
# ------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "app"]
extend-exclude = ["notebooks", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "PD002"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["dengue_alerta"]

# ------------------------------------------------------------------
# Pytest
# ------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "lento: pruebas que entrenan modelos (se pueden omitir con -m 'not lento')",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
