# Integración continua: se ejecuta en cada push y en cada Pull Request.
# Si algo falla, GitHub marca el commit con ❌ y el PR no se puede fusionar
# (configurar "branch protection" en Settings -> Branches -> main).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # botón "Run workflow" para ejecutarlo a mano

concurrency: # si se hace otro push, cancela la ejecución anterior
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Estilo (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "ruff>=0.5"
      - run: ruff check .
      - run: ruff format --check .

  pruebas:
    name: Pruebas (Python ${{ matrix.python }})
    needs: calidad
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Instalar el paquete
        run: pip install -e ".[ml,app,dev]"
      - name: Pruebas unitarias y anti-fuga
        run: pytest --cov=dengue_alerta --cov-report=term-missing

  pipeline:
    name: Pipeline completo con datos sintéticos
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[ml]"
      - name: Generar datos sintéticos
        run: python -m dengue_alerta sintetico --config configs/ci.yaml
      - name: panel -> features -> auditar -> entrenar -> explicar
        run: python -m dengue_alerta todo --config configs/ci.yaml
      - name: Publicar métricas y figuras como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: reportes-ci
          path: reports/
          retention-days: 14
